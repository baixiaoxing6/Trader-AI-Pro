name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate safety invariants and syntax
        run: python scripts/validate.py

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Validate Compose file
        run: docker compose config --quiet

      - name: Load config and strategy with official Freqtrade image
        run: >-
          docker compose run --rm --no-deps freqtrade-signal
          list-strategies
          --config /freqtrade/user_data/configs/config.signal.json
          --strategy-path /freqtrade/user_data/strategies
